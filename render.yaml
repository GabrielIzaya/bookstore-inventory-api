services:
  - type: web
    name: bookstore-inventory-api
    runtime: docker
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: bookstore-inventory-api-ymm7.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://bookstore-inventory-api-ymm7.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bookstore-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: DEFAULT_EXCHANGE_RATE
        value: "1.00"
databases:
  - name: bookstore-db
    plan: free
